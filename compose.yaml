services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      VITE_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

  api:
    build: .
    init: true
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://djqueue:djqueue@postgres:5432/djqueue
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: http://localhost:5173
      DEMO_WORKER_AUTO_START: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: djqueue
      POSTGRES_USER: djqueue
      POSTGRES_PASSWORD: djqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djqueue -d djqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
